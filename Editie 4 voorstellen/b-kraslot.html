<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Editie 4 · Smoesjes wegkrassen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;1,6..96,400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#e2e2e2; --green:#c6ddc6;
    --serif:"Bodoni 72","Bodoni 72 Book","Bodoni Moda","Didot",serif;
    --sans:"Helvetica Neue",Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:var(--bg);color:#000}
  body{font-family:var(--serif);-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none}

  .kop{position:absolute;left:0;right:0;top:0;height:16vh;background:var(--green);border:1px solid #000;
       display:flex;align-items:center;padding:0 3vw;overflow:hidden}
  .kop h1{font-family:var(--sans);font-weight:700;font-size:min(7.4vw,12vh);line-height:1;white-space:nowrap;
          color:var(--bg);-webkit-text-stroke:1px #000}
  .uitleg{position:absolute;left:3vw;right:3vw;top:calc(16vh + 3vh);display:flex;justify-content:space-between;align-items:baseline;
          font-size:clamp(15px,1.6vw,24px)}
  .uitleg em{font-size:.75em;opacity:.65}

  .loten{position:absolute;left:3vw;right:3vw;top:31vh;bottom:6vh;display:grid;grid-template-columns:repeat(5,1fr);gap:1.6vw}
  .lot{position:relative;border:1px solid #000;background:#fff;overflow:hidden;border-radius:2px}
  .lot .onder{position:absolute;inset:0;padding:1.4vw;display:flex;flex-direction:column;justify-content:space-between}
  .lot .nr{font-family:var(--sans);font-size:clamp(11px,.8vw,13px);letter-spacing:.1em}
  .lot .echt{font-size:clamp(16px,1.55vw,26px);line-height:1.12}
  .lot .prijs{font-family:var(--sans);font-size:clamp(12px,.9vw,15px)}
  .lot canvas{position:absolute;inset:0;width:100%;height:100%;cursor:crosshair;touch-action:none;transition:opacity .6s ease}
  .lot.open canvas{opacity:0;pointer-events:none}

  .score{position:absolute;left:0;right:0;bottom:1.6vh;text-align:center;font-size:clamp(13px,1vw,16px);font-style:italic}

  @media (max-width:760px){
    .kop{height:12vh}
    .uitleg{top:calc(12vh + 2vh);flex-direction:column;gap:.3em}
    .loten{top:25vh;bottom:6vh;grid-template-columns:repeat(2,1fr);grid-auto-rows:1fr;gap:3vw;left:4vw;right:4vw}
    .lot:last-child{grid-column:span 2}
    .lot .onder{padding:3vw}
  }
</style>
</head>
<body>
<header class="kop"><h1>SAVE AND BEHAVE</h1></header>
<div class="uitleg"><span>Kras de smoesjes weg.</span><em>wat eronder zit, is wat ik echt dacht</em></div>

<section class="loten" id="loten"></section>
<p class="score" id="score">0 van 5 weggekrast</p>

<script>
/* VOORBEELDINHOUD: vervang door jouw smoesjes van de week */
var LOTEN = [
  { smoes: '100 paar is toch net te weinig', echt: 'Ik draag er drie. De rest staat in de doos.', prijs: 'sneakers · €119' },
  { smoes: 'Want 1 kleurtje is echt te weinig', echt: 'Ik gebruik al twee jaar dezelfde.', prijs: 'lipgloss · €48' },
  { smoes: 'Ik doe zeker en vast iedere dag skincare', echt: 'Mijn vorige fles is nog half vol.', prijs: 'serum · €39' },
  { smoes: 'Zo een specifiek bovenstuk heb ik nog niet', echt: 'Ik heb er 50 andere. Ook in het wit.', prijs: 'blouse · €59' },
  { smoes: 'Zeker geen in suède dus…', echt: 'Ik heb zes tassen. Ik draag er altijd dezelfde.', prijs: 'tas · €145' }
];

var wrap = document.getElementById('loten'), score = document.getElementById('score'), klaar = 0;
var serif = getComputedStyle(document.body).fontFamily;

LOTEN.forEach(function(l, i){
  var d = document.createElement('div'); d.className = 'lot';
  d.innerHTML = '<div class="onder"><div class="nr">SMOES ' + (i+1) + '</div><div class="echt">' + l.echt + '</div><div class="prijs">' + l.prijs + '</div></div><canvas></canvas>';
  wrap.appendChild(d);
  kras(d, d.querySelector('canvas'), l.smoes);
});

function kras(lot, c, tekst){
  var ctx = c.getContext('2d'), dpr = Math.max(1, devicePixelRatio || 1), w, h, bezig = false, laatst = null, telTeller = 0;
  function teken(){
    var r = c.getBoundingClientRect(); w = r.width; h = r.height;
    c.width = w*dpr; c.height = h*dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.globalCompositeOperation = 'source-over';
    // zilveren kraslaag
    var g = ctx.createLinearGradient(0,0,w,h); g.addColorStop(0,'#cfcfcf'); g.addColorStop(.5,'#b9b9b9'); g.addColorStop(1,'#d6d6d6');
    ctx.fillStyle = g; ctx.fillRect(0,0,w,h);
    for(var k=0;k<w*h/18;k++){ ctx.fillStyle = 'rgba(255,255,255,' + Math.random()*.25 + ')'; ctx.fillRect(Math.random()*w, Math.random()*h, 1, 1); }
    // smoes op de kraslaag
    ctx.fillStyle = '#000'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    var fs = Math.max(15, Math.min(w*.12, 28)); ctx.font = 'italic ' + fs + 'px ' + serif;
    var lijnen = breek('"' + tekst + '"', w*.8, ctx), y0 = h/2 - (lijnen.length-1)*fs*.6;
    lijnen.forEach(function(t, j){ ctx.fillText(t, w/2, y0 + j*fs*1.2); });
    ctx.font = (fs*.45) + 'px Helvetica, Arial, sans-serif'; ctx.fillText('KRAS HIER', w/2, h - fs);
  }
  function breek(t, max, ctx){
    var woorden = t.split(' '), lijnen = [], r = '';
    woorden.forEach(function(wd){ var p = r ? r + ' ' + wd : wd; if(ctx.measureText(p).width > max && r){ lijnen.push(r); r = wd; } else r = p; });
    lijnen.push(r); return lijnen;
  }
  function veeg(x, y){
    ctx.globalCompositeOperation = 'destination-out'; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.lineWidth = Math.max(26, w*.14);
    ctx.beginPath(); ctx.moveTo(laatst ? laatst.x : x, laatst ? laatst.y : y); ctx.lineTo(x, y); ctx.stroke();
    laatst = {x:x, y:y};
    if(++telTeller % 8 === 0) check();
  }
  function check(){
    var d = ctx.getImageData(0,0,c.width,c.height).data, leeg = 0, n = 0;
    for(var i=3;i<d.length;i+=64){ n++; if(d[i]===0) leeg++; }
    if(leeg/n > .5 && !lot.classList.contains('open')){ lot.classList.add('open'); score.textContent = (++klaar) + ' van ' + LOTEN.length + ' weggekrast'; if(klaar===LOTEN.length) score.textContent = 'Alle smoesjes weg. Wat overblijft, is de waarheid.'; }
  }
  function pos(e){ var r = c.getBoundingClientRect(); return {x:e.clientX-r.left, y:e.clientY-r.top}; }
  c.addEventListener('pointerdown', function(e){ bezig = true; laatst = null; c.setPointerCapture(e.pointerId); var p = pos(e); veeg(p.x,p.y); });
  c.addEventListener('pointermove', function(e){ if(!bezig) return; var p = pos(e); veeg(p.x,p.y); });
  c.addEventListener('pointerup', function(){ bezig = false; check(); });
  c.addEventListener('pointercancel', function(){ bezig = false; });
  // ook krassen door er gewoon over te bewegen met de muis (zonder klikken)
  c.addEventListener('pointerenter', function(){ laatst = null; });
  c.addEventListener('mousemove', function(e){ if(bezig) return; var p = pos(e); veeg(p.x,p.y); });
  (document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(teken);
  teken();
}
</script>
<script src="../menu/menu.js" defer></script>
</body>
</html>
