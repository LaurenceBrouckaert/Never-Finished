<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Editie 4 · Doe niets</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;1,6..96,400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#e2e2e2; --green:#c6ddc6;
    --serif:"Bodoni 72","Bodoni 72 Book","Bodoni Moda","Didot",serif;
    --sans:"Helvetica Neue",Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:var(--bg);color:#000}
  body{font-family:var(--serif);-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none;touch-action:none}

  .wacht{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2vh;
         transition:opacity 1.2s ease}
  .wacht .opdracht{position:absolute;top:10vh;left:0;right:0;text-align:center;font-size:clamp(18px,2.2vw,36px)}
  .wacht .getal{font-size:clamp(140px,34vh,420px);line-height:.9;font-variant-numeric:lining-nums tabular-nums}
  .wacht .status{position:absolute;bottom:10vh;left:0;right:0;text-align:center;font-size:clamp(14px,1.2vw,19px);font-style:italic;min-height:1.4em;opacity:.65}
  .ring{position:absolute;width:min(52vh,78vw);aspect-ratio:1;pointer-events:none}
  .ring circle{fill:none;stroke:#000;stroke-width:.4}
  .ring .vol{stroke-dasharray:314.16;stroke-dashoffset:314.16;transform:rotate(-90deg);transform-origin:50% 50%}
  .te-vroeg .getal{animation:schud .35s ease}
  @keyframes schud{25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}

  /* wat zich onthult */
  .inhoud{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:center;padding:0 8vw;gap:3vh;
          opacity:0;pointer-events:none}
  .inhoud.aan{pointer-events:auto}
  .inhoud .band{position:absolute;left:0;right:0;top:0;height:16vh;background:var(--green);border:1px solid #000;
                display:flex;align-items:center;padding:0 3vw;overflow:hidden}
  .inhoud .band h1{font-family:var(--sans);font-weight:700;font-size:min(7.4vw,12vh);white-space:nowrap;color:var(--bg);-webkit-text-stroke:1px #000}
  .inhoud .zin{font-size:clamp(22px,3.3vw,56px);line-height:1.1;max-width:22ch;opacity:0;transform:translateY(10px);
               transition:opacity 1.4s ease,transform 1.4s ease}
  .inhoud .zin.aan{opacity:1;transform:none}
  .inhoud .klein{font-size:clamp(14px,1.2vw,19px);font-style:italic;opacity:0;transition:opacity 1.4s ease}
  .inhoud .klein.aan{opacity:.65}
</style>
</head>
<body>
<section class="wacht" id="wacht">
  <svg class="ring" viewBox="0 0 102 102" aria-hidden="true"><circle cx="51" cy="51" r="50"/><circle class="vol" id="vol" cx="51" cy="51" r="50"/></svg>
  <p class="opdracht">Doe 10 seconden helemaal niets.</p>
  <div class="getal" id="getal" aria-live="polite">10</div>
  <p class="status" id="status">niet klikken, niet scrollen, niet bewegen</p>
</section>

<section class="inhoud" id="inhoud">
  <div class="band"><h1>NIKS DOEN</h1></div>
  <!-- VOORBEELDINHOUD: vervang door jouw reflectie van de week -->
  <p class="zin">Tien seconden. Zo lang duurt het om iets in je mandje te leggen.</p>
  <p class="zin">Zo lang duurde het deze week ook om het <em>niet</em> te doen.</p>
  <p class="zin">€0 uitgegeven. 5 keer bijna.</p>
  <p class="klein">Beweeg je muis om opnieuw te beginnen.</p>
</section>

<script>
var DUUR = 10;
var wacht = document.getElementById('wacht'), getal = document.getElementById('getal'), status = document.getElementById('status');
var vol = document.getElementById('vol'), inhoud = document.getElementById('inhoud');
var start = performance.now(), klaar = false, pogingen = 0;
var zinnen = [].slice.call(inhoud.querySelectorAll('.zin, .klein'));
var SMOESJES = ['te vroeg.', 'zie je, moeilijk he.', 'net als op "koop nu" klikken.', 'nog eens.', 'geduld is ook sparen.'];

function reset(){
  if(klaar){
    // na het onthullen: bewegen brengt je terug naar het begin
    klaar = false; inhoud.classList.remove('aan'); inhoud.style.opacity = 0;
    zinnen.forEach(function(z){ z.classList.remove('aan'); });
    wacht.style.opacity = 1; status.textContent = 'opnieuw. doe niets.';
  } else {
    if(performance.now() - start < 250) return;
    status.textContent = SMOESJES[pogingen++ % SMOESJES.length];
    wacht.classList.remove('te-vroeg'); void wacht.offsetWidth; wacht.classList.add('te-vroeg');
  }
  start = performance.now();
}

function lus(t){
  if(!klaar){
    var verstreken = (t - start) / 1000, rest = Math.max(0, DUUR - verstreken);
    getal.textContent = Math.ceil(rest);
    vol.style.strokeDashoffset = 314.16 * (rest / DUUR);
    // het scherm wordt rustiger naarmate je langer wacht
    if(rest === 0){ klaar = true; onthul(); }
  }
  requestAnimationFrame(lus);
}

function onthul(){
  wacht.style.opacity = 0;
  inhoud.classList.add('aan'); inhoud.style.transition = 'opacity 1.2s ease'; inhoud.style.opacity = 1;
  zinnen.forEach(function(z, i){ setTimeout(function(){ if(klaar) z.classList.add('aan'); }, 900 + i * 1700); });
}

['mousemove','mousedown','keydown','wheel','touchstart','scroll'].forEach(function(t){
  addEventListener(t, reset, { passive: true });
});
requestAnimationFrame(lus);
</script>
</body>
</html>
