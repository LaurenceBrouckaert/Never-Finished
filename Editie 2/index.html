<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mijn Kast</title>
<style>
:root{--bg:#f4eee4;--bg2:#ebe2d3;--ink:#5b4d3d;--ring:#cdbda5}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--bg);overscroll-behavior:none}
img{user-select:none;-webkit-user-drag:none;-webkit-user-select:none}
.scene{position:fixed;inset:0;opacity:0;pointer-events:none;transition:opacity .9s ease}
.scene.on{opacity:1;pointer-events:auto}

/* 1. kast */
#intro{background:var(--bg);cursor:pointer}
#intro video,#intro canvas,#intro .poster{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
#intro #src{width:2px;height:2px;inset:auto;left:0;top:0;opacity:.01;pointer-events:none}

/* 2. rek */
#rack{background:radial-gradient(ellipse at 50% 40%,#fbf7f0 0%,var(--bg) 55%,var(--bg2) 100%)}
#strip{position:absolute;inset:0;display:flex;align-items:center;overflow-x:auto;overflow-y:hidden;
  scroll-snap-type:x mandatory;scrollbar-width:none;padding:0 calc(50vw - 21vh);gap:6vh;-webkit-overflow-scrolling:touch}
#strip::-webkit-scrollbar{display:none}
.item{flex:0 0 42vh;height:66vh;scroll-snap-align:center;display:flex;align-items:center;justify-content:center;cursor:pointer;
  transition:transform .35s ease,opacity .35s ease;will-change:transform}
.item.worn img{opacity:.18;filter:grayscale(.4)}
.item img{transition:opacity .5s;max-width:100%;max-height:100%;object-fit:contain;filter:drop-shadow(0 10px 18px rgba(90,70,40,.18));
  animation:float 6s ease-in-out infinite;animation-delay:var(--d)}
@keyframes float{0%,100%{transform:translateY(0) rotate(-1.6deg)}50%{transform:translateY(-10px) rotate(1.6deg)}}
@media (max-aspect-ratio:3/4){#strip{padding:0 calc(50vw - 33vw);gap:8vw}.item{flex-basis:66vw;height:60vh}}

/* knoppen (enkel iconen) */
.btn{position:absolute;width:48px;height:48px;border-radius:50%;border:0;background:rgba(255,255,255,.72);
  box-shadow:0 4px 14px rgba(90,70,40,.15);display:grid;place-items:center;cursor:pointer;color:var(--ink);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);transition:transform .2s}
.btn:hover{transform:scale(1.07)}
.btn svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#toMirror{right:max(18px,env(safe-area-inset-right));bottom:max(22px,env(safe-area-inset-bottom))}
#toRack{left:max(16px,env(safe-area-inset-left));top:max(16px,env(safe-area-inset-top));z-index:5}
#undress{right:max(16px,env(safe-area-inset-right));top:max(16px,env(safe-area-inset-top));z-index:5}

/* 3. spiegel */
#mirror{background:var(--bg)}
#stage{position:absolute;left:0;right:0;top:0;bottom:104px;overflow:hidden;touch-action:none}
#world{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
#world.anim{transition:transform 1.8s cubic-bezier(.6,.05,.25,1)}
#world>img.me{display:block;width:100%;height:100%}
.wear{position:absolute;touch-action:none;cursor:grab;transform-origin:50% 0;
  filter:drop-shadow(0 3px 5px rgba(0,0,0,.22));transition:opacity .5s ease}
.wear.drop{animation:drop .7s cubic-bezier(.3,1.4,.5,1)}
@keyframes drop{from{transform:translateY(-14%) scale(1.04);opacity:0}to{transform:none;opacity:1}}
#tray{position:absolute;left:0;right:0;bottom:0;height:104px;display:flex;gap:12px;align-items:center;
  overflow-x:auto;scrollbar-width:none;padding:0 16px max(8px,env(safe-area-inset-bottom));background:linear-gradient(transparent,rgba(235,226,211,.9) 30%)}
#tray::-webkit-scrollbar{display:none}
#tray button{flex:0 0 76px;height:76px;border-radius:18px;border:0;background:#fff8ee;cursor:pointer;display:grid;place-items:center;
  box-shadow:0 2px 8px rgba(90,70,40,.1);transition:transform .2s,box-shadow .2s}
#tray button img{max-width:62px;max-height:62px}
#tray button.on{box-shadow:0 0 0 3px var(--ring),0 4px 12px rgba(90,70,40,.18);transform:translateY(-3px)}
@media (min-width:700px){#tray{justify-content:center}}
</style>
</head>
<body>

<section class="scene on" id="intro">
  <img class="poster" src="kast0.jpg" alt="">

  <video id="src" src="kastp.mp4" playsinline muted preload="auto" crossorigin="anonymous"></video>

72,15.357,3.609],[0.53803,-0.03193,334.12054,0.03193,0.53803,109.42258,15.408,4.015],[0.53854,-0.03509,351.29057,0.03509,0.53854,111.6396,16.359,4.423],[0.53866,-0.03994,370.48395,0.03994,0.53866,114.09479,17.523,5.606],[0.54033,-0.0449,388.74005,0.0449,0.54033,116.24677,17.536,5.924],[0.5432,-0.0497,406.02469,0.0497,0.5432,118.49049,17.394,6.344]];               // per beeld: beeld -> kast-coördinaten (+ beweging)
const RACK={"S": 3, "OX": 0, "OY": -60, "CW": 3450, "CH": 3300, "items": [{"n": 3, "x": 399, "y": 300, "w": 870, "h": 951}, {"n": 6, "x": 630, "y": 300, "w": 802, "h": 1208}, {"n": 4, "x": 593, "y": 300, "w": 817, "h": 1208}, {"n": 9, "x": 989, "y": 300, "w": 856, "h": 1208}, {"n": 2, "x": 1302, "y": 301, "w": 870, "h": 1043}, {"n": 7, "x": 1587, "y": 300, "w": 738, "h": 1208}, {"n": 0, "x": 1658, "y": 300, "w": 798, "h": 1208}, {"n": 8, "x": 1846, "y": 300, "w": 848, "h": 1208}, {"n": 1, "x": 1951, "y": 300, "w": 805, "h": 1208}, {"n": 5, "x": 2298, "y": 300, "w": 870, "h": 993}]};             // waar elk kledingstuk aan de stang hangt
const FPS=30, TS=2/RACK.S;       // textuur op schaal 2
let vid=$('#src'), cv=$('#gl'), gl=null, prog, texV, texG, useGL=true;
const gCanvas=document.createElement('canvas');
gCanvas.width=Math.round(RACK.CW*TS);gCanvas.height=Math.round(RACK.CH*TS);
const sprites={};
RACK.items.forEach(it=>{const im=new Image();im.src=`k/${it.n}.webp`;sprites[it.n]=im;im.onload=()=>{drawRack();}});
let wornSet=new Set();
function drawRack(){
  const c=gCanvas.getContext('2d');c.clearRect(0,0,gCanvas.width,gCanvas.height);
  const X0=110,X1=1038,RAIL=47;
  const tx=x=>(x-RACK.OX)*RACK.S*TS, ty=y=>(y-RACK.OY)*RACK.S*TS;
  RACK.items.forEach(it=>{
    const im=sprites[it.n];if(!im.complete||!im.naturalWidth||wornSet.has(it.n))return;
    const x=it.x*TS,y=it.y*TS,w=it.w*TS,h=it.h*TS;
    // schaduw op de achterwand (binnen de kast)
    c.save();c.beginPath();c.rect(tx(X0),ty(RAIL+7),tx(X1)-tx(X0),gCanvas.height);c.clip();
    c.shadowColor='rgba(0,0,0,.5)';c.shadowBlur=24;c.shadowOffsetX=20+gCanvas.width;c.shadowOffsetY=28;
    c.drawImage(im,x-gCanvas.width,y,w,h);c.restore();
    c.drawImage(im,x,y,w,h);
  });
  if(gl){gl.bindTexture(gl.TEXTURE_2D,texG);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,gCanvas);}
}
function initGL(){
  gl=cv.getContext('webgl',{premultipliedAlpha:false,alpha:false});
  if(!gl) throw 0;
  const vs=`attribute vec2 p;varying vec2 uv;void main(){uv=vec2(p.x*.5+.5,.5-p.y*.5);gl_Position=vec4(p,0,1);}`;
  const fs=`precision highp float;varying vec2 uv;uniform sampler2D V,G;uniform vec3 A,B;uniform vec2 vel,org,size;uniform float on;
  vec4 g(vec2 r){vec2 t=(r-org)/size;if(t.x<0.||t.y<0.||t.x>1.||t.y>1.)return vec4(0);vec4 c=texture2D(G,t);return vec4(c.rgb*c.a,c.a);}
  void main(){
    vec3 plate=texture2D(V,vec2(uv.x,uv.y*.5)).rgb;
    float keep=texture2D(V,vec2(uv.x,.5+uv.y*.5)).r;
    vec3 f=vec3(uv.x*1280.,uv.y*720.,1.);
    vec2 r=vec2(dot(A,f),dot(B,f));
    vec4 acc=vec4(0);
    for(int i=0;i<7;i++){acc+=g(r+vel*(float(i)/6.-.5));}
    acc/=7.;
    vec3 col=acc.a>0.001?acc.rgb/acc.a:vec3(0);
    gl_FragColor=vec4(mix(plate,col,clamp(acc.a*keep*on,0.,1.)),1);
  }`;
  const sh=(t,src)=>{const o=gl.createShader(t);gl.shaderSource(o,src);gl.compileShader(o);if(!gl.getShaderParameter(o,gl.COMPILE_STATUS))throw gl.getShaderInfoLog(o);return o;};
  prog=gl.createProgram();gl.attachShader(prog,sh(gl.VERTEX_SHADER,vs));gl.attachShader(prog,sh(gl.FRAGMENT_SHADER,fs));gl.linkProgram(prog);gl.useProgram(prog);
  const buf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buf);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
  const loc=gl.getAttribLocation(prog,'p');gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
  const mk=()=>{const t=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,t);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);return t;};
  gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL,false);
  texV=mk();texG=mk();
  gl.activeTexture(gl.TEXTURE1);gl.bindTexture(gl.TEXTURE_2D,texG);gl.activeTexture(gl.TEXTURE0);
  gl.uniform1i(gl.getUniformLocation(prog,'V'),0);gl.uniform1i(gl.getUniformLocation(prog,'G'),1);
  gl.uniform2f(gl.getUniformLocation(prog,'org'),RACK.OX,RACK.OY);
  gl.uniform2f(gl.getUniformLocation(prog,'size'),RACK.CW/RACK.S,RACK.CH/RACK.S);
  gl.viewport(0,0,1280,720);
  gl.activeTexture(gl.TEXTURE1);drawRack();gl.activeTexture(gl.TEXTURE0);
}
let lastFrame=-1;
function render(time){
  if(!gl||vid.readyState<2)return;
  const fi=Math.min(INV.length-1,Math.max(0,Math.round(time*FPS)));
  gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,texV);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGB,gl.RGB,gl.UNSIGNED_BYTE,vid);
  const m=INV[fi],U=n=>gl.getUniformLocation(prog,n);
  if(m){gl.uniform3f(U('A'),m[0],m[1],m[2]);gl.uniform3f(U('B'),m[3],m[4],m[5]);gl.uniform2f(U('vel'),m[6],m[7]);gl.uniform1f(U('on'),1);}
  else gl.uniform1f(U('on'),0);
  gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
  cv.style.opacity=1;
}
function loop(){
  if('requestVideoFrameCallback' in vid){
    const cb=(now,md)=>{render(md.mediaTime);vid.requestVideoFrameCallback(cb);};vid.requestVideoFrameCallback(cb);
  } else {const f=()=>{render(vid.currentTime);requestAnimationFrame(f);};requestAnimationFrame(f);}
}
cv.style.opacity=0;
try{
  if(location.protocol==='file:') throw 'lokaal'; // dubbelklik/sleep in Chrome: WebGL mag de bestanden niet lezen
  initGL();loop();
}
catch(e){ // terugval: vaste video met alle kleren
  useGL=false;cv.remove();
  vid.removeAttribute('crossorigin');vid.src='kast.mp4';vid.id='vid';vid.style.cssText='opacity:1;width:100%;height:100%;inset:0';
}
vid.play().catch(()=>{});
scenes.intro.addEventListener('click',()=>{
  if(vid.readyState<2){show('rack');return;}
  if(vid.paused){vid.muted=false;vid.play().catch(()=>{vid.muted=true;vid.play().catch(()=>{})});}
  else if(vid.muted){vid.muted=false;}
  else {vid.pause();show('rack');}
});
vid.addEventListener('ended',()=>show('rack'));
/* vangnet: als de video niet laadt, toch doorgaan naar het rek */
vid.addEventListener('error',()=>{ if(current==='intro') show('rack'); });
setTimeout(()=>{ if(current==='intro' && vid.readyState<2) show('rack'); },5000);
/* de binnenkant van de kast hoogstens 3 seconden tonen (kast gaat open rond 4,7 s) */
const END_AT=7.6;
function checkEnd(){
  if(current==='intro'&&!vid.paused&&vid.currentTime>=END_AT){vid.pause();show('rack');}
  requestAnimationFrame(checkEnd);
}
requestAnimationFrame(checkEnd);
function replayCloset(){
  wornSet=new Set(Object.values(worn).filter(i=>i!==null).map(i=>ITEMS[i].n));
  drawRack();
  show('intro');
  try{vid.currentTime=4.0;}catch(e){}
  vid.play().catch(()=>{});
}

/* ---------- 2. het rek ---------- */
const strip=$('#strip');
const cards=ITEMS.map((it,i)=>{
  const b=document.createElement('div');b.className='item';
  const im=new Image();im.src=`g/${it.n}.webp`;im.alt='';im.draggable=false;im.style.setProperty('--d',(-i*1.3)+'s');
  b.appendChild(im);strip.appendChild(b);
  b.addEventListener('click',()=>{
    const r=b.getBoundingClientRect(),c=innerWidth/2;
    if(Math.abs(r.left+r.width/2-c)>r.width*.4){strip.scrollBy({left:r.left+r.width/2-c,behavior:'smooth'});return;}
    wear(i,true);show('mirror');
  });
  return b;
});
strip.addEventListener('wheel',e=>{
  if(Math.abs(e.deltaY)>Math.abs(e.deltaX)){e.preventDefault();strip.scrollBy({left:e.deltaY*1.2});}
},{passive:false});
addEventListener('keydown',e=>{
  if(current==='rack'){
    const w=cards[0].getBoundingClientRect().width+parseFloat(getComputedStyle(strip).gap);
    if(e.key==='ArrowRight')strip.scrollBy({left:w,behavior:'smooth'});
    if(e.key==='ArrowLeft')strip.scrollBy({left:-w,behavior:'smooth'});
  }
});
function rackFx(){
  const c=innerWidth/2;
  cards.forEach(b=>{
    const r=b.getBoundingClientRect(),d=Math.min(1,Math.abs(r.left+r.width/2-c)/(innerWidth*.55));
    b.style.transform=`scale(${1-d*.28})`;b.style.opacity=1-d*.55;
  });
}
strip.addEventListener('scroll',()=>requestAnimationFrame(rackFx),{passive:true});
addEventListener('resize',()=>{rackFx();if(current==='mirror')fit(false);});
$('#toMirror').addEventListener('click',()=>show('mirror'));

/* ---------- 3. de spiegel ---------- */
const stage=$('#stage'),world=$('#world'),tray=$('#tray');
world.style.width=PW+'px';world.style.height=PH+'px';
let view={s:1,x:0,y:0};
function fitRect(r,pad){
  const W=stage.clientWidth,H=stage.clientHeight;
  const s=Math.min((W-pad*2)/r.w,(H-pad*2)/r.h);
  const clamp=(v,size,view)=>size*s<=view?(view-size*s)/2:Math.min(0,Math.max(view-size*s,v));
  return {s,x:clamp(W/2-(r.x+r.w/2)*s,PW,W),y:clamp(H/2-(r.y+r.h/2)*s,PH,H)};
}
function apply(v){view=v;world.style.transform=`translate(${v.x}px,${v.y}px) scale(${v.s})`;}
function fit(animate){
  world.classList.toggle('anim',!!animate);
  apply(fitRect(MIRROR,Math.min(28,stage.clientWidth*.04)));
}
let firstVisit=true;
function enterMirror(){
  if(firstVisit){
    firstVisit=false;
    world.classList.remove('anim');apply(fitRect({x:0,y:0,w:PW,h:PH},0));
    setTimeout(()=>fit(true),500);
  } else fit(false);
}

const worn={top:null,bottom:null}, layers={}, pos={};
const thumbs=ITEMS.map((it,i)=>{
  const b=document.createElement('button');b.setAttribute('aria-label','kledingstuk');
  const im=new Image();im.src=`g/${it.n}.webp`;im.alt='';b.appendChild(im);tray.appendChild(b);
  b.addEventListener('click',()=>{ if(worn[it.type]===i) takeOff(it.type); else wear(i,true); });
  return b;
});
function place(i){
  const it=ITEMS[i],p=pos[i],el=layers[i];
  el.style.width=p.w+'px';el.style.left=(p.x-p.w/2)+'px';el.style.top=p.y+'px';
}
function wear(i,anim){
  const it=ITEMS[i];
  if(worn[it.type]!==null&&worn[it.type]!==i) takeOff(it.type);
  if(!layers[i]){
    const el=new Image();el.src=`c/${it.n}.webp`;el.alt='';el.className='wear';el.draggable=false;
    el.style.zIndex=it.type==='bottom'?3:2;
    layers[i]=el;bindGestures(el,i);
    const a=it.type==='top'?NECK:WAIST;
    pos[i]={x:a.x+it.dx,y:a.y+it.dy,w:it.w};
  }
  const el=layers[i];
  world.appendChild(el);place(i);el.style.opacity=1;
  if(anim){el.classList.remove('drop');void el.offsetWidth;el.classList.add('drop');}
  worn[it.type]=i;syncTray();
}
function takeOff(type){
  const i=worn[type];if(i===null)return;
  const el=layers[i];el.style.opacity=0;setTimeout(()=>{if(worn[type]!==i)el.remove();},500);
  worn[type]=null;syncTray();
}
function syncTray(){thumbs.forEach((b,i)=>b.classList.toggle('on',worn[ITEMS[i].type]===i));cards.forEach((c,i)=>c.classList.toggle('worn',worn[ITEMS[i].type]===i));}
$('#undress').addEventListener('click',()=>{takeOff('top');takeOff('bottom');});
$('#toRack').addEventListener('click',replayCloset);

/* verschuiven en vergroten van een kledingstuk */
function bindGestures(el,i){
  const pts=new Map();let start=null;
  const snap=()=>{
    const a=[...pts.values()];
    const c=a.reduce((s,p)=>({x:s.x+p.x/a.length,y:s.y+p.y/a.length}),{x:0,y:0});
    const d=a.length>1?Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y):0;
    start={c,d,p:{...pos[i]}};
  };
  el.addEventListener('pointerdown',e=>{e.preventDefault();el.setPointerCapture(e.pointerId);pts.set(e.pointerId,{x:e.clientX,y:e.clientY});snap();el.style.cursor='grabbing';});
  el.addEventListener('pointermove',e=>{
    if(!pts.has(e.pointerId))return;pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    const a=[...pts.values()];
    const c=a.reduce((s,p)=>({x:s.x+p.x/a.length,y:s.y+p.y/a.length}),{x:0,y:0});
    const p=pos[i];
    p.x=start.p.x+(c.x-start.c.x)/view.s;p.y=start.p.y+(c.y-start.c.y)/view.s;
    if(a.length>1&&start.d>0){const d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);p.w=Math.max(40,Math.min(400,start.p.w*d/start.d));}
    place(i);
  });
  const up=e=>{pts.delete(e.pointerId);if(pts.size)snap();else el.style.cursor='grab';};
  el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);
  el.addEventListener('wheel',e=>{e.preventDefault();const p=pos[i];p.w=Math.max(40,Math.min(400,p.w*(e.deltaY<0?1.04:1/1.04)));place(i);},{passive:false});
}
