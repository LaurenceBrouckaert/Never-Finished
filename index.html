<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Koopverbod</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:#000}
  .home{position:fixed;inset:0;overflow:hidden}
  /* afbeelding vult het scherm; links schalen mee */
  .doek{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:max(100vw,calc(100dvh * 5692 / 3200));aspect-ratio:5692/3200}
  /* gsm rechtop: inzoomen op de zak zodat de nummers groot genoeg zijn */
  @media (max-aspect-ratio:1/1){.doek{width:132vw}}
  .doek img{display:block;width:100%;height:100%;user-select:none;-webkit-user-drag:none}
  .editie{position:absolute;top:49%;width:9%;height:12%;
          font-size:0;color:transparent;-webkit-tap-highlight-color:transparent;cursor:pointer}
  .editie:focus-visible{outline:none}
  .e1{left:24.5%} .e2{left:42.8%} .e3{left:68%}
  /* onderlijning bij hover, in de kleur van de tekening */
  .editie::after{content:"";position:absolute;left:15%;right:14%;top:88%;height:4.5%;border-radius:2px;
                 background:#e27868;transform:scaleX(0);transform-origin:left;transition:transform .25s ease}
  .editie:hover::after,.editie:focus-visible::after{transform:scaleX(1)}
</style>
</head>
<body>
<main class="home">
  <div class="doek">
    <img src="home.png" alt="Koopverbod: edities 01 tot 08" draggable="false">
    <a class="editie e1" href="Editie%201/index.html">Editie 1</a>
    <a class="editie e2" href="Editie%202/index.html">Editie 2</a>
    <a class="editie e3" href="Editie%203/index.html">Editie 3</a>
  </div>
</main>
</body>
</html>
