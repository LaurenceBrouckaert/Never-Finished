<style>
  :root{

    --groen:#c6ddc6; --grijs:#e2e2e2; --zwart:#000000; --roze:#d37868;

  /* kruisje rechtsboven staat op de groene legende: daar wat ruimte voor laten */
  .rechts .samen{padding-top:76px}

  .kaart{position:relative;background:var(--grijs);min-height:0;overflow:hidden;cursor:grab;touch-action:none}
  .kaart.sleept{cursor:grabbing}
  .kaart svg{position:absolute;inset:0;width:100%;height:100%;display:block}
  .kaart .titel{position:absolute;left:18px;top:16px;z-index:2;pointer-events:none;background:var(--grijs);border:1px solid var(--zwart);padding:12px 14px 12px}
  .kaart .titel small{display:block;font-size:10px;letter-spacing:.1em;text-transform:uppercase}
  .kaart .titel b{display:block;font-family:var(--serif);font-weight:400;font-size:clamp(28px,2.8vw,46px);line-height:.95;margin-top:.25em}
  .kaart .titel b em{color:var(--roze)}
  .kaart .hint{position:absolute;left:18px;bottom:14px;font-size:11px;letter-spacing:.06em;pointer-events:none;background:var(--grijs);padding:4px 8px;border:1px solid var(--zwart)}

  /* gebouwen: lijntekening */
  .dak{fill:var(--grijs);stroke:var(--zwart);stroke-width:.6;stroke-linejoin:round}
  .muur{stroke:var(--zwart);stroke-width:.6;stroke-linejoin:round}
  .muur.a{fill:var(--grijs)} .muur.b{fill:var(--grijs)}
  .winkelpand .dak,.winkelpand .muur{fill:var(--roze)}
  .winkelpand.aan .dak{fill:var(--zwart)}
  .kaart-raam{fill:var(--zwart);stroke:var(--zwart);stroke-width:.6}
  .kaart-licht{fill:var(--grijs);opacity:.92}
  .kaart-kleed{fill:var(--roze);stroke:var(--zwart);stroke-width:.3}
  .kaart-rail{stroke:var(--zwart);stroke-width:.8}
  svg.dichtbij .pin .kader{opacity:1}
  .kaart svg{transition:transform .5s cubic-bezier(.5,0,.8,.4),opacity .5s}
  .kaart.duik svg{transform:scale(3.2);opacity:0}

  .grond-water{fill:none;stroke:var(--groen);stroke-linecap:round;stroke-linejoin:round}
  .grond-plein{fill:var(--grijs);stroke:var(--zwart);stroke-width:.8}
  .snaam{font-family:var(--sans);letter-spacing:.16em;text-transform:uppercase;fill:var(--zwart)}
  .plek{font-family:var(--serif);font-style:italic;fill:var(--zwart)}
  .route{fill:none;stroke:var(--roze);stroke-linecap:round;stroke-linejoin:round;opacity:.9}
  .pijl{fill:var(--roze)}

  /* pins: nummer boven het winkelpand */
  .pin{cursor:pointer}
  .pin .steel{stroke:var(--zwart);stroke-width:1.2}
  .pin .bol{fill:var(--zwart)}
  .pin .cijfer{font-family:var(--sans);font-weight:700;fill:var(--grijs);text-anchor:middle;dominant-baseline:central;pointer-events:none}
  .pin .ring{fill:none;stroke:var(--roze);stroke-width:2.4;stroke-dasharray:8 7;opacity:0;transition:opacity .25s}
  .pin .kader{opacity:0;transition:opacity .2s;pointer-events:none}
  .pin .kader rect{fill:var(--grijs);stroke:var(--zwart);stroke-width:1}
  .pin .kader text{font-family:var(--sans);fill:var(--zwart)}
  .pin .kader .n{font-family:var(--serif);font-size:20px}
  .pin:hover .kader,.pin.aan .kader{opacity:1}
  .pin.aan .ring{opacity:1}
  .pin.aan .bol{fill:var(--roze)}
  .pin:focus{outline:none} .pin:focus-visible .bol{stroke:var(--roze);stroke-width:4}

  /* ---------- LEGENDE ---------- */
  .rechts{display:flex;flex-direction:column;min-height:0}
  .rechts .samen{background:var(--groen);padding:16px 18px 18px}
  .rechts .samen small{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase}
  .rechts .samen b{display:block;font-family:var(--serif);font-weight:400;font-size:clamp(30px,2.8vw,48px);line-height:1;margin-top:.25em}
  .rechts .samen span{display:block;font-size:12px;margin-top:.5em}
  .lijst{background:var(--roze);flex:1;overflow-y:auto;padding:10px 14px 18px;border-top:1px solid var(--zwart)}
  .lijst h3{font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:400;margin:14px 4px 6px}
  .lijst h3:first-child{margin-top:6px}
  .item{display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:start;width:100%;text-align:left;border:0;background:none;
        font:inherit;color:inherit;cursor:pointer;padding:7px 4px;border-radius:6px}
  .item .nr{width:26px;height:26px;border-radius:50%;background:var(--zwart);color:var(--grijs);display:grid;place-items:center;font-size:12px;font-weight:700}
  .item strong{display:block;font-size:13px;line-height:1.2}
  .item small{display:block;font-size:11px;line-height:1.3;opacity:.75}
  .item:hover,.item.aan{background:rgba(0,0,0,.08)}
  .item:focus-visible{outline:1px solid var(--zwart)}
  .kleren{display:none;margin:6px 0 4px 40px;border-top:1px dashed var(--zwart)}
  .item.aan + .kleren{display:block}
  .kleren li{list-style:none;display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;padding:7px 0;border-bottom:1px dashed var(--zwart)}
  .kleren img{width:44px;height:52px;object-fit:contain}
  .kleren span{font-family:var(--serif);font-size:16px;line-height:1.1}
  .kleren em{font-style:normal;font-size:12px}
  .kleren .tot{display:block;text-align:right;font-family:var(--serif);font-size:15px;padding:6px 0 2px}

  /* telefoon: gestapeld */
  @media (max-aspect-ratio:1/1){
    .affiche{display:flex;flex-direction:column;height:auto;padding:calc(var(--rand) + 56px) var(--rand) var(--rand)}
    .kaart{aspect-ratio:4/5}
    .kaart .titel{left:10px;top:10px;padding:8px 10px}
    .kaart .titel b{font-size:24px}
    .lijst{overflow:visible}
  }
</style>

    w.planXY = [dx * t, dy * t]; w.richting = [dx, dy];
    w.adres += ', ' + Math.round(afstand([midLat, midLon], w.ver) / 10) * 10 + ' km';
  });

  /* ---------- de schuine blik ---------- */
  var hoek = -0.35, KANTEL = .56, gekozen = null, zoom = 0;
  var inStadPlan = WINKELS.filter(function(w){ return !w.ver; }).map(function(w){ return plan(w.pt); });
  var MIDDEN = [inStadPlan.reduce(function(s, p){ return s + p[0]; }, 0) / inStadPlan.length, inStadPlan.reduce(function(s, p){ return s + p[1]; }, 0) / inStadPlan.length];
  var KIJK = MIDDEN.slice();          // waar je naar kijkt (verschuift als je ergens op inzoomt)
  function standaardZoom(){ return kaart.clientWidth < 700 ? 620 : 980; }
  function proj(p, z){
    var cs = Math.cos(hoek), sn = Math.sin(hoek);
    var x = p[0] * cs - p[1] * sn, y = p[0] * sn + p[1] * cs;
    return [x, y * KANTEL - (z || 0), y];
  }
  function pad(pts, z){ return pts.map(function(p, i){ var q = proj(p, z); return (i ? 'L' : 'M') + q[0].toFixed(1) + ' ' + q[1].toFixed(1); }).join(''); }
  function veelhoek(pts){ return pts.map(function(q){ return q[0].toFixed(1) + ',' + q[1].toFixed(1); }).join(' '); }

  var lijst = document.getElementById('lijst'), items = {};

  function teken(){
    svg.innerHTML = '';
    var defs = el('defs', {});
    /* beeldvullend: we kijken naar een stuk stad rond de winkels, de stad loopt door buiten beeld */
    var BW = kaart.clientWidth || 800, BH = kaart.clientHeight || 600;
    var vw = zoom, vh = zoom * BH / BW;
    var mid = proj(KIJK, 0);
    var vx = mid[0] - vw / 2, vy = mid[1] - vh / 2 - 30;
    svg.setAttribute('viewBox', vx + ' ' + vy + ' ' + vw + ' ' + vh);
    svg.setAttribute('preserveAspectRatio', 'xMidYMid slice');
    svg.classList.toggle('dichtbij', zoom < 520);
    function inBeeld(q, m){ return q[0] > vx - m && q[0] < vx + vw + m && q[1] > vy - m && q[1] < vy + vh + m; }

    var grond = el('g', {});

    /* de Leie */
    el('path', { class: 'grond-water', d: pad(LEIE_PLAN), 'stroke-width': 50 }, grond);
    /* straten: alleen een naam op de grond, de straat zelf is de leegte tussen de huizen */
    STRATEN.forEach(function(s, i){
      if(s.pt.length < 3 && s.naam.length > 8) return;
      var pts = s.pt.map(plan), a = proj(pts[0]), z = proj(pts[pts.length - 1]);
      el('path', { d: pad(s.plan), fill: 'none', stroke: '#000', 'stroke-width': .5, 'stroke-dasharray': '1 6', 'stroke-linecap': 'round' }, grond);
      if(z[0] < a[0]) pts = pts.slice().reverse();
      el('path', { id: 'sp' + i, d: pad(pts), fill: 'none' }, defs);
      var t = el('text', { class: 'snaam', 'font-size': 9, dy: 3 }, grond);
      var tp = el('textPath', { href: '#sp' + i, startOffset: '50%', 'text-anchor': 'middle' }, t); tp.textContent = s.naam;
    });
    /* pleinen */
    PLEKKEN.forEach(function(p){
      var c = plan(p.pt), pts = [];
      for(var a = 0; a < 24; a++){ var h = a / 24 * Math.PI * 2; pts.push(proj([c[0] + Math.cos(h) * p.r, c[1] + Math.sin(h) * p.r], 0)); }
      el('polygon', { class: 'grond-plein', points: veelhoek(pts) }, grond);
    });

    /* route langs de winkels in de stad */
    var inStad = WINKELS.filter(function(w){ return !w.ver; });
    el('path', { class: 'route', d: pad(inStad.map(function(w){ return plan(w.pt); })), 'stroke-width': 7 }, grond);

    /* pijlen naar online winkels, zoals op de grond geschilderd */
    WINKELS.forEach(function(w){
      if(!w.ver) return;
      var e = w.planXY, r = w.richting, s0 = [e[0] - r[0] * 220, e[1] - r[1] * 220];
      el('path', { class: 'route', d: pad([s0, [e[0] - r[0] * 26, e[1] - r[1] * 26]]), 'stroke-width': 10 }, grond);
      var n = [-r[1], r[0]], top = e, b1 = [e[0] - r[0] * 34 + n[0] * 16, e[1] - r[1] * 34 + n[1] * 16], b2 = [e[0] - r[0] * 34 - n[0] * 16, e[1] - r[1] * 34 - n[1] * 16];
      el('polygon', { class: 'pijl', points: veelhoek([proj(top), proj(b1), proj(b2)]) }, grond);
    });

    /* gebouwen: van achter naar voor */
    var cs = Math.cos(hoek), sn = Math.sin(hoek);
    var lijstG = gebouwen.map(function(g){ return { g: g, diep: g.c[0] * sn + g.c[1] * cs }; }).sort(function(a, b){ return a.diep - b.diep; });
    var stad = el('g', {});
    lijstG.forEach(function(o){
      var g = o.g, hx = g.w / 2, hy = g.d / 2;
      var voet = [[g.c[0] - hx, g.c[1] - hy], [g.c[0] + hx, g.c[1] - hy], [g.c[0] + hx, g.c[1] + hy], [g.c[0] - hx, g.c[1] + hy]];
      var onder = voet.map(function(p){ return proj(p, 0); });
      if(!inBeeld(onder[0], 80)) return;
      var boven = voet.map(function(p){ return proj(p, g.h); });
      var grp = el('g', { class: g.winkel ? 'winkelpand' + (g.winkel === gekozen ? ' aan' : '') : '' }, stad);
      for(var i = 0; i < 4; i++){
        var j = (i + 1) % 4;
        /* alleen muren die naar ons kijken */
        var mx = (voet[i][0] + voet[j][0]) / 2 - g.c[0], my = (voet[i][1] + voet[j][1]) / 2 - g.c[1];
        var naarOns = mx * sn + my * cs;
        if(naarOns <= 0) continue;
        var licht = (mx * cs - my * sn) > 0 ? 'b' : 'a';
        el('polygon', { class: 'muur ' + licht, points: veelhoek([onder[i], onder[j], boven[j], boven[i]]) }, grp);
        /* dichtbij: de etalage van de winkel wordt zichtbaar */
        if(g.winkel && zoom < 560){
          var P = function(u, v){ var a = [onder[i][0] + (onder[j][0] - onder[i][0]) * u, onder[i][1] + (onder[j][1] - onder[i][1]) * u],
                                      b = [boven[i][0] + (boven[j][0] - boven[i][0]) * u, boven[i][1] + (boven[j][1] - boven[i][1]) * u];
                                  return [a[0] + (b[0] - a[0]) * v, a[1] + (b[1] - a[1]) * v]; };
          el('polygon', { class: 'kaart-raam', points: veelhoek([P(.1,.06), P(.9,.06), P(.9,.55), P(.1,.55)]) }, grp);
          el('polygon', { class: 'kaart-licht', points: veelhoek([P(.14,.1), P(.86,.1), P(.86,.5), P(.14,.5)]) }, grp);
          for(var u = .22; u < .82; u += .12){ var q1 = P(u, .46), q2 = P(u + .05, .46), q3 = P(u + .05, .2), q4 = P(u, .2);
            el('polygon', { class: 'kaart-kleed', points: veelhoek([q1, q2, q3, q4]) }, grp); }
          el('line', { class: 'kaart-rail', x1: P(.16,.48)[0], y1: P(.16,.48)[1], x2: P(.84,.48)[0], y2: P(.84,.48)[1] }, grp);
        }
      }
      el('polygon', { class: 'dak', points: veelhoek(boven) }, grp);
    });

    /* plaatsnamen boven de daken */
    var namen = el('g', {});
    PLEKKEN.forEach(function(p){
      var q = proj(plan(p.pt), 0);
      var t = el('text', { class: 'plek', x: q[0], y: q[1] + 6, 'text-anchor': 'middle', 'font-size': 17 * Math.min(1, zoom / 800) }, namen); t.textContent = p.naam;
    });
    var lq = proj(plan([51.0475,3.7189]), 0);
    var lt = el('text', { class: 'plek', x: lq[0], y: lq[1], 'text-anchor': 'middle', 'font-size': 24 * Math.min(1, zoom / 800) }, namen); lt.textContent = 'Leie';

    /* noordpijl rechtsboven in beeld, draait mee */
    var nf = Math.min(1, zoom / 900), nx = vx + vw - 50 * nf, ny = vy + 70 * nf, nd = proj([0, -40], 0), n0 = proj([0, 0], 0);
    var ux = nd[0] - n0[0], uy = nd[1] - n0[1], ul = Math.hypot(ux, uy) || 1; ux /= ul; uy /= ul;
    el('path', { d: 'M' + (nx - ux * 22 * nf) + ' ' + (ny - uy * 22 * nf) + ' L' + (nx + ux * 22 * nf) + ' ' + (ny + uy * 22 * nf), stroke: '#000', 'stroke-width': 1.5 * nf }, namen);
    var nt = el('text', { class: 'plek', x: nx + ux * 38 * nf, y: ny + uy * 38 * nf + 7 * nf, 'text-anchor': 'middle', 'font-size': 22 * nf }, namen); nt.textContent = 'N';

    /* pins */
    var pinsG = el('g', {});
    var volgorde = WINKELS.slice().sort(function(a, b){ return (a === gekozen) - (b === gekozen); });
    volgorde.forEach(function(w){
      var basis, top;
      if(w.ver){ basis = proj(w.planXY, 0); top = [basis[0], basis[1] - 40]; }
      else { basis = proj(w.pand.c, w.pand.h); top = [basis[0], basis[1] - 34]; }
      var g = el('g', { class: 'pin' + (w === gekozen ? ' aan' : ''), tabindex: 0, role: 'button', 'aria-label': w.nr + '. ' + w.naam + ', ' + w.adres }, pinsG);
      /* gestippelde cirkel op de grond, zoals een detail */
      var c0 = w.ver ? w.planXY : w.pand.c, ring = [];
      for(var a = 0; a < 40; a++){ var h = a / 40 * Math.PI * 2; ring.push(proj([c0[0] + Math.cos(h) * 70 * Math.min(1, zoom / 600), c0[1] + Math.sin(h) * 70 * Math.min(1, zoom / 600)], 0)); }
      el('polygon', { class: 'ring', points: veelhoek(ring) }, g);
      /* nummer en kader blijven even groot op het scherm, hoe ver je ook inzoomt */
      var sc = Math.min(1, zoom / 900);
      top = [basis[0], basis[1] - (basis[1] - top[1]) * sc];
      el('line', { class: 'steel', x1: basis[0], y1: basis[1], x2: top[0], y2: top[1] }, g);
      var kop = el('g', { transform: 'translate(' + top[0] + ' ' + top[1] + ') scale(' + sc + ') translate(' + (-top[0]) + ' ' + (-top[1]) + ')' }, g);
      el('circle', { class: 'bol', cx: top[0], cy: top[1], r: 12 }, kop);
      if(w.tweedehands) el('circle', { cx: top[0], cy: top[1], r: 15.5, fill: 'none', stroke: '#000', 'stroke-width': 1.2 }, kop);
      var tx = el('text', { class: 'cijfer', x: top[0], y: top[1] + .5, 'font-size': 12 }, kop); tx.textContent = w.nr;
      /* tekstkader */
      var k = el('g', { class: 'kader' }, kop), bw = Math.max(w.naam.length * 10.5, w.adres.length * 5.6) + 26;
      var links = top[0] > 0, kx = links ? top[0] - 22 - bw : top[0] + 22, ky = top[1] - 26;
      el('rect', { x: kx, y: ky, width: bw, height: 52 }, k);
      var t1 = el('text', { class: 'n', x: kx + 12, y: ky + 23 }, k); t1.textContent = w.naam;
      var t2 = el('text', { x: kx + 12, y: ky + 41, 'font-size': 10, 'letter-spacing': '.06em' }, k); t2.textContent = w.adres.toUpperCase();
      g.addEventListener('click', function(e){ e.stopPropagation(); kies(w, true); });
      g.addEventListener('keydown', function(e){ if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); kies(w, true); } });
    });
  }

  function kies(w, scroll){
    gekozen = gekozen === w ? null : w;
    Object.keys(items).forEach(function(k){ items[k].classList.toggle('aan', gekozen && gekozen.nr == k); });
    if(gekozen && scroll) items[gekozen.nr].scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    teken();
  }

  /* ---------- legende ---------- */
  var totaal = 0, stuks = 0;
  function kop(t){ var h = document.createElement('h3'); h.textContent = t; lijst.appendChild(h); }
  WINKELS.forEach(function(w, i){
    if(i === 0) kop('In de stad');
    if(w.ver && !WINKELS[i - 1].ver) kop('Online');
    var som = w.kleren.reduce(function(s, k){ return s + k.prijs; }, 0); totaal += som; stuks += w.kleren.length;
    var b = document.createElement('button'); b.className = 'item';
    b.innerHTML = '<span class="nr">' + w.nr + '</span><span><strong>' + w.naam + '</strong><small>' + w.adres + '<br>' +
                  w.kleren.length + (w.kleren.length === 1 ? ' stuk' : ' stukken') + ' · ' + euro(som) + (w.tweedehands ? ' · tweedehands' : '') + '</small></span>';
    var ul = document.createElement('ul'); ul.className = 'kleren';
    ul.innerHTML = w.kleren.map(function(k){
      return '<li><img src="' + BEELD + k.n + '.webp" alt="" loading="lazy"><span>' + k.naam + '</span><em>' + euro(k.prijs) + '</em></li>';
    }).join('') + '<span class="tot">samen ' + euro(som) + '</span>';
    lijst.appendChild(b); lijst.appendChild(ul);
    b.addEventListener('click', function(){ kies(w, false); });
    items[w.nr] = b;
  });
  document.getElementById('totaal').textContent = euro(totaal);
  document.getElementById('aantal').textContent = stuks + ' stukken uit ' + WINKELS.length + ' winkels';

  /* ---------- draaien (slepen), zoomen (scrollen of knijpen) ---------- */
  var wacht = false, vingers = {}, sleep = null, knijp = null, gedoken = false;
  function later(){ if(!wacht){ wacht = true; requestAnimationFrame(function(){ wacht = false; teken(); }); } }
  /* schermpunt -> plek op de grond (plattegrond) */
  function grondOp(cx, cy){
    var pt = svg.createSVGPoint(); pt.x = cx; pt.y = cy;
    var q = pt.matrixTransform(svg.getScreenCTM().inverse());
    var cs = Math.cos(hoek), sn = Math.sin(hoek), xr = q.x, yr = q.y / KANTEL;
    return [xr * cs + yr * sn, -xr * sn + yr * cs];
  }
  function zoomNaar(nieuw, cx, cy){
    nieuw = Math.max(150, Math.min(1700, nieuw));
    var m = grondOp(cx, cy), f = nieuw / zoom;
    KIJK = [m[0] + (KIJK[0] - m[0]) * f, m[1] + (KIJK[1] - m[1]) * f];
    zoom = nieuw; later();
    if(zoom < 210 && !gedoken) duik();
  }
  /* zo dichtbij dat je de straat in stapt */
  function duik(){
    gedoken = true;
    var best = null, bd = 1e9;
    WINKELS.forEach(function(w){ if(w.ver) return; var p = plan(w.pt), d = Math.hypot(p[0] - KIJK[0], p[1] - KIJK[1]); if(d < bd){ bd = d; best = w; } });
    kaart.classList.add('duik');
    setTimeout(function(){
      if(window.openWandel) window.openWandel(best);
      kaart.classList.remove('duik');
    }, 480);
  }
  window.kaartNaar = function(w){
    zoom = 330; KIJK = plan(w.pt); gedoken = false; teken();
  };

  kaart.addEventListener('pointerdown', function(e){
    if(e.target.closest('.pin') || e.target.closest('button')) return;
    vingers[e.pointerId] = { x: e.clientX, y: e.clientY };
    var ids = Object.keys(vingers);
    if(ids.length === 1){ sleep = { x: e.clientX, h: hoek }; kaart.classList.add('sleept'); }
    if(ids.length === 2){
      var a = vingers[ids[0]], b = vingers[ids[1]];
      knijp = { d: Math.hypot(a.x - b.x, a.y - b.y), z: zoom }; sleep = null;
    }
  });
  addEventListener('pointermove', function(e){
    if(!vingers[e.pointerId]) return;
    vingers[e.pointerId] = { x: e.clientX, y: e.clientY };
    var ids = Object.keys(vingers);
    if(knijp && ids.length >= 2){
      var a = vingers[ids[0]], b = vingers[ids[1]], d = Math.hypot(a.x - b.x, a.y - b.y);
      zoomNaar(knijp.z * knijp.d / Math.max(20, d), (a.x + b.x) / 2, (a.y + b.y) / 2);
    } else if(sleep){
      hoek = sleep.h + (e.clientX - sleep.x) * .006; later();
    }
  });
  function los(e){ delete vingers[e.pointerId]; if(Object.keys(vingers).length < 2) knijp = null; if(!Object.keys(vingers).length){ sleep = null; kaart.classList.remove('sleept'); } }
  addEventListener('pointerup', los); addEventListener('pointercancel', los);

  kaart.addEventListener('wheel', function(e){
    e.preventDefault();
    zoomNaar(zoom * Math.pow(1.0018, e.deltaY * (e.deltaMode === 1 ? 16 : 1)), e.clientX, e.clientY);
  }, { passive: false });
  addEventListener('resize', function(){ teken(); });
  zoom = standaardZoom();
  teken();
})();

  var lijn = document.createElementNS(NS, 'polyline');
  lijn.setAttribute('points', stad.map(function(w){ return mp(w.pt).join(','); }).join(' '));
  lijn.setAttribute('fill', 'none'); lijn.setAttribute('stroke', '#d37868'); lijn.setAttribute('stroke-width', '3'); miniSvg.appendChild(lijn);
  stad.forEach(function(w){ var c = document.createElementNS(NS, 'circle'), q = mp(w.pt); c.setAttribute('cx', q[0]); c.setAttribute('cy', q[1]); c.setAttribute('r', 2.6); miniSvg.appendChild(c); });
  var ik = document.createElementNS(NS, 'circle'); ik.setAttribute('r', 6); ik.setAttribute('fill', '#000'); ik.setAttribute('stroke', '#e2e2e2'); ik.setAttribute('stroke-width', 2); miniSvg.appendChild(ik);
  function mini(){
    var p = stad[0].pt;
    for(var i = 1; i < stad.length; i++){
      var a = stad[i - 1], b = stad[i];
      if(pos <= b.afstand){ var t = Math.max(0, (pos - a.afstand) / (b.afstand - a.afstand)); p = [a.pt[0] + (b.pt[0] - a.pt[0]) * t, a.pt[1] + (b.pt[1] - a.pt[1]) * t]; break; }
      p = b.pt;
    }
    var q = mp(p); ik.setAttribute('cx', q[0]); ik.setAttribute('cy', q[1]);
  }

  /* ---------- wat ik er kocht ---------- */
  var gekocht = document.getElementById('wGekocht');
  function toonGekocht(w){
    if(w.andere){
      gekocht.innerHTML = '<h3>' + w.naam + '</h3><p>hier kocht ik niets · nog niet</p><button type="button">verder wandelen</button>';
      gekocht.querySelector('button').addEventListener('click', function(){ gekocht.classList.remove('open'); });
      gekocht.classList.add('open'); return;
    }
    var som = w.kleren.reduce(function(s, k){ return s + k.prijs; }, 0);
    function euro(n){ return '€' + n.toFixed(n % 1 ? 2 : 0).replace('.', ','); }
    gekocht.innerHTML = '<h3>' + w.naam + '</h3><p>' + w.adres + ' · ' + w.kleren.length + ' in mijn kast · ' + euro(som) + '</p><ul>' +
      w.kleren.map(function(k){ return '<li><img src="' + BEELD + k.n + '.webp" alt=""><span>' + k.naam + '</span><em>' + euro(k.prijs) + '</em></li>'; }).join('') +
      '</ul><button type="button">verder wandelen</button>';
    gekocht.querySelector('button').addEventListener('click', function(){ gekocht.classList.remove('open'); });
    gekocht.classList.add('open');
  }

  /* ---------- openen en sluiten ---------- */
  /* naar een plek springen (meter) */
  window.wandelNaar = function(m){ doel = m; if(!bezig){ bezig = true; requestAnimationFrame(teken); } };
  window.wandelWinkels = stad;
  window.openWandel = function(w){
    open();
    if(w && w.afstand != null){ doel = pos = Math.max(0, w.afstand - 16); }
  };
  function open(){ scherm.classList.add('open'); doel = pos = 0; bezig = true; requestAnimationFrame(teken); }
  function sluit(){
    scherm.classList.remove('open'); gekocht.classList.remove('open');
    /* terug op de kaart, ingezoomd waar je was */
    var best = stad[0], bd = 1e9;
    stad.forEach(function(w){ var a = Math.abs(w.afstand - pos); if(a < bd){ bd = a; best = w; } });
    if(window.kaartNaar) window.kaartNaar(best);
  }
  document.getElementById('wTerug').addEventListener('click', sluit);
})();
</script>
