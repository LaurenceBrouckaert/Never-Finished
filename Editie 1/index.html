<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Koopverbod</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Bodoni Moda is enkel een reserve voor toestellen zonder Bodoni 72 (Windows/Android) -->
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400&display=swap" rel="stylesheet">
<!-- Vorige versies van deze editie: index-oud.html (eerste) en index-v2-oud.html (met de nummertjes) -->
<style>
  :root{
    --black:#000000;
    --green:#c6ddc6;
    --beige:#e2e2e2;
    --serif:"Bodoni 72","Bodoni 72 Book","Bodoni Moda","Didot",serif;
    --sans:"Helvetica Neue",Helvetica,Arial,sans-serif;
    /* 1 eenheid = 1% van een 16:9 kader dat altijd in het scherm past */
    --u:min(1vw, 1.7778vh);
    --rij:calc(100vh / 9);   /* 9 objecten tegelijk in beeld */
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:var(--beige);color:var(--black)}
  body{font-family:var(--serif);-webkit-font-smoothing:antialiased;touch-action:manipulation}

  .screen{position:fixed;inset:0;height:100vh;height:100dvh;width:100vw;overflow:hidden;background:var(--beige)}

  .link{font-family:var(--serif);font-weight:400;background:none;border:0;color:var(--black);
        text-decoration:underline;text-underline-offset:.12em;text-decoration-thickness:1px;cursor:pointer}
  .link:hover{opacity:.6}

  /* ---------- BAND ---------- */
  .band{display:none}
  .band h1{position:absolute;left:0;top:50%;transform:translateY(-50%);
        font-family:var(--sans);font-weight:700;font-size:calc(var(--u)*15.1);line-height:1;
        letter-spacing:-.005em;white-space:nowrap;color:var(--beige);
        -webkit-text-stroke:max(1px, calc(var(--u)*.09)) var(--black)}

  /* ---------- LINKS: UITLEG + EXCUSES ---------- */
  .links{position:absolute;left:0;top:0;bottom:0;width:41.1%;border:1px solid var(--black);z-index:2;background:var(--beige)}
  .intro{position:absolute;left:8.1%;right:12%;top:6%;font-size:calc(var(--u)*1.32);line-height:1.08;text-transform:uppercase}
  .excuses{position:absolute;left:8.1%;right:10%;top:20%;bottom:8.5%;list-style:none;
           display:flex;flex-direction:column;justify-content:space-between}
  .excuse{font-size:calc(var(--u)*1.32);line-height:1.25;cursor:grab;touch-action:none;
          align-self:flex-start;max-width:100%;padding:.15em .35em;margin:-.15em -.35em;border-radius:.3em;
          transition:background-color .2s,opacity .3s}
  .excuse:hover{background:rgba(0,0,0,.06)}
  .excuse.gekozen{background:var(--green)}
  .excuse.sleept{opacity:.25}
  .excuse.klaar{opacity:.3;text-decoration:line-through;text-decoration-thickness:1px;cursor:default;background:none}

  /* het excuus dat je meesleept */
  .spook{position:fixed;left:0;top:0;z-index:50;pointer-events:none;max-width:min(380px,40vw);
         font-size:calc(var(--u)*1.32);line-height:1.25;padding:.45em .8em;background:var(--green);
         border:1px solid var(--black);border-radius:.3em;box-shadow:0 10px 22px rgba(0,0,0,.18);
         transform:translate(-50%,-120%) rotate(-2deg)}

  .links .saved,.links .again{position:absolute;bottom:2.5%;font-size:calc(var(--u)*1.6);padding:0;display:none}
  .links .saved{left:8.1%}
  .links .again{right:8%}
  .done .links .saved,.done .links .again{display:block}

  /* ---------- RECHTS: OBJECTEN OP EEN EINDELOZE LOOP ---------- */
  .rechts{position:absolute;left:41.1%;right:0;top:0;bottom:0;overflow:hidden;margin-left:-1px}
  .loop{position:absolute;left:0;right:0;top:0;will-change:transform}
  .row{position:relative;height:var(--rij);display:flex;align-items:center;border:1px solid var(--black);
       margin-top:-1px;background:var(--beige);transition:background-color .45s ease}
  .row.solved{background:var(--green)}
  .row.doel{background:#d4e6d4}
  .row.nee{animation:nee .4s ease}
  @keyframes nee{20%,60%{transform:translateX(-1.2%)}40%,80%{transform:translateX(1.2%)}}

  .word{position:relative;display:inline-block;font-family:var(--sans);font-weight:700;
        font-size:calc(var(--u)*4.15);line-height:1;letter-spacing:-.005em;white-space:nowrap;transition:transform .45s ease}

  /* meer info verschijnt onder het woord zodra het juist is */
  .note{position:absolute;left:0;top:calc(100% + var(--u)*.3);white-space:nowrap;
        font-family:var(--serif);font-weight:400;font-size:calc(var(--u)*1.3);line-height:1.25;
        letter-spacing:-.01em;opacity:0;pointer-events:none;transition:opacity .45s ease .1s}
  .note span + span::before{content:" · "}
  .row.solved .note{opacity:1}
  .row.solved .word{transform:translateY(calc(var(--u)*-1.35))}

  /* ---------- RESULTAAT ---------- */
  .result{position:absolute;left:12.4%;right:12.1%;top:11.8%;bottom:12.8%;background:var(--black);
          display:none;flex-direction:column;align-items:center;justify-content:center;z-index:5;
          cursor:pointer;opacity:0;transform:scale(.97);transition:opacity .5s ease,transform .5s ease}
  .result.show{display:flex}
  .result.in{opacity:1;transform:none}
  .result .big{font-family:var(--sans);font-weight:700;color:var(--beige);line-height:.9;letter-spacing:-.01em}
  .result .g{font-size:calc(var(--u)*11.3)}
  .result .amount{font-family:var(--serif);color:var(--green);font-size:calc(var(--u)*22.5);
                  line-height:.95;letter-spacing:-.02em;margin-top:calc(var(--u)*-.6)}
  .result .bottom{display:flex;align-items:baseline;justify-content:space-between;width:84%;margin-top:calc(var(--u)*.4)}
  .result .u{font-size:calc(var(--u)*6.3)}
  .result .spent{font-family:var(--serif);color:var(--green);font-size:calc(var(--u)*6.3);line-height:1}

  /* ---------- GSM / SMAL SCHERM ---------- */
  @media (max-aspect-ratio:1/1){
    :root{--rij:calc(50vh / 5)}
    .links{left:0;right:0;width:auto;top:0;bottom:auto;height:50%;border-right:1px solid var(--black)}
    .intro{left:5%;right:5%;top:76px;font-size:3vw}
    .excuses{left:5%;right:4%;top:calc(76px + 9%);bottom:9%}
    .excuse{font-size:3.1vw}
    .spook{font-size:3.4vw;max-width:70vw}
    .links .saved,.links .again{font-size:4vw;bottom:2%}
    .links .saved{left:5%}
    .links .again{right:5%}
    .rechts{left:0;top:50%;margin-left:0}
    .row{padding-left:5% !important}
    .word{font-size:6.4vw}
    .note{font-size:3.1vw;top:calc(100% + 1vw)}
    .row.solved .word{transform:translateY(-1.2vh)}

    .result{left:5%;right:5%;top:20%;bottom:20%}
    .result .g{font-size:16.5vw}
    .result .amount{font-size:30vw}
    .result .u{font-size:8.6vw}
    .result .spent{font-size:8.6vw}
  }
</style>
</head>
<body>

<section class="screen" id="match">

  <div class="links">
    <p class="intro">Match de excuses bij het object en kom zo te weten hoeveel ik spaarde en wat ik uitgaf deze week.</p>
    <ol class="excuses" id="excuses"></ol>
    <button class="link saved" id="showResult">saved or spent</button>
    <button class="link again" id="again">opnieuw</button>
  </div>

  <div class="rechts" id="rechts">
    <div class="loop" id="loop"></div>
  </div>

  <div class="result" id="result" title="Klik om te sluiten">
    <div class="big g">GESPAARD</div>
    <div class="amount" id="gespaard">0</div>
    <div class="bottom">
      <div class="big u">UITGEGEVEN</div>
      <div class="spent" id="uitgegeven">0</div>
    </div>
  </div>
</section>

<script>
/* ===================== INHOUD =====================
   EXCUSES: in de volgorde waarin ze links staan.
   OBJECTEN: in de volgorde waarin ze rechts voorbijkomen.
     excuus   = het nummer van het excuus dat erbij hoort (1 = het eerste excuus)
     prijs    = in euro (gebruik een punt: 22.95)
     gekocht  = true als je het toch kocht (telt bij UITGEGEVEN), anders telt het bij GESPAARD
     waarom   = de uitleg die verschijnt als het juist is
     inspring = hoe ver het woord naar rechts staat (in % van de kolom)
   De objecten 6 t.e.m. 10 (prijs, waarom, gekocht) zijn VOORBEELDEN: vul je eigen gegevens in. */
const EXCUSES = [
  '100 paar is toch net te weinig',
  'Want 1 kleurtje is echt wel te weinig',
  'Want ik doe zeker en vast iedere dag skincare',
  'Zo een specifieke bovenstuk heb ik nog niet, (50 andere wel)',
  'Heb er nog niet genoeg&nbsp; en zeker geen in suede dus …',
  'Als ik het nu niet koop, is het straks uitverkocht en heb ik er spijt van',
  'De verzendkosten zijn gratis vanaf €50, dus eigenlijk maak ik winst',
  'Ik heb het echt nodig om die ene andere broek eindelijk te kunnen combineren',
  'Mijn vorige versie is al bijna drie maanden oud',
  'Ik heb deze week al heel goed gespaard, dus ik mag mezelf belonen'
];
const OBJECTEN = [
  { naam:'FRINGE JASJE',         excuus:10, prijs:54.99, gekocht:false, waarom:'niet gekocht want ik heb er al een in het zwart', inspring:38 },
  { naam:'BRUINE SUEDE JAS',     excuus:5,  prijs:139,   gekocht:false, waarom:'niet gekocht want te duur',                         inspring:3.5 },
  { naam:'GESTREEPTE SOFT TOP',  excuus:4,  prijs:22.95, gekocht:false, waarom:'niet gekocht want hoeveel topjes heb je nodig',     inspring:7 },
  { naam:'MILKY TONER',          excuus:3,  prijs:9.99,  gekocht:false, waarom:'wil ik nog kopen dus wrs wel',                      inspring:17 },
  { naam:'ZWARTE SLEEHAK PUMPS', excuus:1,  prijs:19.99, gekocht:true,  waarom:'oeps gekocht',                                      inspring:2.5 },
  { naam:'BORDEAUX MASCARA',     excuus:2,  prijs:4.99,  gekocht:true,  waarom:'oeps gekocht',                                      inspring:3.5 },
  { naam:'HIGH NECK TRENCH',     excuus:6,  prijs:69.95, gekocht:false, waarom:'niet gekocht want hij is nog steeds niet uitverkocht', inspring:20 },
  { naam:'ZEBRA PRINT PUMPS',    excuus:8,  prijs:39.99, gekocht:false, waarom:'niet gekocht want die broek draag ik toch nooit',   inspring:4 },
  { naam:'PLAID HOEDJE',         excuus:7,  prijs:12.99, gekocht:false, waarom:'niet gekocht want zonder hoedje geen €50',          inspring:39 },
  { naam:'BLAUWE TRAINING',      excuus:9,  prijs:34.99, gekocht:false, waarom:'niet gekocht want de oude is nog perfect',          inspring:4.5 }
];
const SNELHEID = 26;   // pixels per seconde

/* ===================== OPBOUW ===================== */
const match = document.getElementById('match'), result = document.getElementById('result');
const lijst = document.getElementById('excuses'), loop = document.getElementById('loop'), rechts = document.getElementById('rechts');
const euro = n => n.toFixed(2).replace('.', ',');

EXCUSES.forEach((t, i) => {
  const li = document.createElement('li');
  li.className = 'excuse'; li.dataset.nr = i + 1; li.innerHTML = t; li.tabIndex = 0;
  lijst.appendChild(li);
});

// de objecten staan er twee keer na elkaar in, zo loopt de lijst naadloos rond
function rij(o, i){
  const d = document.createElement('div');
  d.className = 'row'; d.dataset.id = i; d.dataset.answer = o.excuus;
  d.style.paddingLeft = o.inspring + '%';
  d.innerHTML = '<span class="word">' + o.naam +
    '<span class="note"><span>' + euro(o.prijs) + ' euro</span><span>' + o.waarom + '</span></span></span>';
  return d;
}
[0, 1].forEach(() => OBJECTEN.forEach((o, i) => loop.appendChild(rij(o, i))));
const rijen = () => [...loop.querySelectorAll('.row')];

// totalen voor de pop-up
document.getElementById('gespaard').textContent   = euro(OBJECTEN.filter(o => !o.gekocht).reduce((s, o) => s + o.prijs, 0));
document.getElementById('uitgegeven').textContent = euro(OBJECTEN.filter(o =>  o.gekocht).reduce((s, o) => s + o.prijs, 0));

/* ===================== EINDELOZE LOOP ===================== */
let y = 0, pauze = false, vorig = performance.now();
function halve(){ return loop.scrollHeight / 2; }
(function lus(t){
  const dt = Math.min(.1, (t - vorig) / 1000); vorig = t;
  if (!pauze && !matchMedia('(prefers-reduced-motion: reduce)').matches) y += SNELHEID * dt;
  const h = halve(); if (h) { y = ((y % h) + h) % h; }
  loop.style.transform = 'translate3d(0,' + (-y) + 'px,0)';
  requestAnimationFrame(lus);
})(vorig);
// zelf scrollen kan ook
rechts.addEventListener('wheel', e => { e.preventDefault(); y += e.deltaY; }, { passive:false });

/* ===================== SLEPEN ===================== */
let spook = null, sleep = null, gekozen = null;

function rijOnder(x, yy){
  const el = document.elementFromPoint(x, yy);
  return el ? el.closest('.row') : null;
}
function markeerDoel(r){
  rijen().forEach(x => x.classList.toggle('doel', !!r && x.dataset.id === r.dataset.id && !x.classList.contains('solved')));
}

lijst.addEventListener('pointerdown', e => {
  const li = e.target.closest('.excuse'); if (!li || li.classList.contains('klaar')) return;
  e.preventDefault();
  sleep = { li, x:e.clientX, y:e.clientY, bezig:false, id:e.pointerId };
  li.setPointerCapture(e.pointerId);
});
lijst.addEventListener('pointermove', e => {
  if (!sleep) return;
  if (!sleep.bezig && Math.hypot(e.clientX - sleep.x, e.clientY - sleep.y) > 6) {
    sleep.bezig = true; pauze = true;
    sleep.li.classList.add('sleept');
    spook = document.createElement('div'); spook.className = 'spook'; spook.innerHTML = sleep.li.innerHTML;
    document.body.appendChild(spook);
    kies(null);
  }
  if (!sleep.bezig) return;
  spook.style.left = e.clientX + 'px'; spook.style.top = e.clientY + 'px';
  markeerDoel(rijOnder(e.clientX, e.clientY));
});
function los(e){
  if (!sleep) return;
  const s = sleep; sleep = null;
  if (s.bezig) {
    spook.remove(); spook = null; s.li.classList.remove('sleept'); markeerDoel(null);
    const r = rijOnder(e.clientX, e.clientY);
    if (r) probeer(s.li, r);
    pauze = false;
  } else {
    // gewoon tikken: kies het excuus, tik daarna op een object (handig op de gsm)
    kies(gekozen === s.li ? null : s.li);
  }
}
lijst.addEventListener('pointerup', los);
lijst.addEventListener('pointercancel', e => { if (sleep && sleep.bezig) { spook.remove(); spook = null; sleep.li.classList.remove('sleept'); markeerDoel(null); pauze = false; } sleep = null; });

function kies(li){
  if (gekozen) gekozen.classList.remove('gekozen');
  gekozen = li; if (li) li.classList.add('gekozen');
  pauze = !!li;
}
loop.addEventListener('click', e => {
  const r = e.target.closest('.row'); if (!r || !gekozen) return;
  const li = gekozen; kies(null); probeer(li, r);
});
lijst.addEventListener('keydown', e => {
  const li = e.target.closest('.excuse');
  if (li && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); kies(gekozen === li ? null : li); }
});

function probeer(li, r){
  if (r.classList.contains('solved')) return;
  const zelfde = rijen().filter(x => x.dataset.id === r.dataset.id);
  if (r.dataset.answer === li.dataset.nr) {
    zelfde.forEach(x => x.classList.add('solved'));
    li.classList.add('klaar');
    checkDone();
  } else {
    zelfde.forEach(x => { x.classList.remove('nee'); void x.offsetWidth; x.classList.add('nee'); });
  }
}

/* ===================== RESULTAAT ===================== */
function openResult(){
  result.classList.add('show');
  requestAnimationFrame(() => requestAnimationFrame(() => result.classList.add('in')));
}
function closeResult(){
  result.classList.remove('in');
  setTimeout(() => result.classList.remove('show'), 500);
}
document.getElementById('showResult').addEventListener('click', openResult);
result.addEventListener('click', closeResult);

let resultTimer;
function checkDone(){
  if (rijen().every(r => r.classList.contains('solved'))) {
    match.classList.add('done');
    resultTimer = setTimeout(openResult, 1400);
  }
}
document.getElementById('again').addEventListener('click', () => {
  clearTimeout(resultTimer);
  result.classList.remove('in', 'show');
  match.classList.remove('done');
  rijen().forEach(r => r.classList.remove('solved', 'nee'));
  lijst.querySelectorAll('.excuse').forEach(li => li.classList.remove('klaar'));
});
</script>
<script>
/* KOOPVERBOD altijd volledig tonen: verklein de titel als hij breder is dan de band */
(function(){
  var h=document.querySelector('.band h1'); if(!h) return;
  function past(){
    h.style.fontSize='';
    var bw=h.parentElement.clientWidth; if(!bw) return;
    var w=h.scrollWidth;
    if(w>bw*.99) h.style.fontSize=(parseFloat(getComputedStyle(h).fontSize)*bw*.99/w)+'px';
  }
  if(window.ResizeObserver) new ResizeObserver(past).observe(h.parentElement); else addEventListener('resize',past);
  if(document.fonts&&document.fonts.ready) document.fonts.ready.then(past);
  past();
})();
</script>
<script src="../menu/menu.js" defer></script>
</body>
</html>
